# [GRAFANA] 1/3 — Vector logging sidecar -> Grafana Cloud Loki
# Requires this Secret in namespace "remote-execution" (keys LOKI_USER, LOKI_TOKEN):
#   kubectl create secret generic grafana-loki-credentials -n remote-execution \
#     --from-literal=LOKI_USER=1816118 --from-literal=LOKI_TOKEN=<token>
loggingSidecar:
  enabled: true
  name: vector-logging-sidecar
  image: timberio/vector:0.45.0-debian
  imagePullPolicy: IfNotPresent
  preStopSleepSeconds: 5

  # commonEnv is NOT passed to the sidecar, so credentials are injected here
  env:
    - name: LOKI_USER
      valueFrom:
        secretKeyRef:
          name: grafana-loki-credentials
          key: LOKI_USER
    - name: LOKI_TOKEN
      valueFrom:
        secretKeyRef:
          name: grafana-loki-credentials
          key: LOKI_TOKEN

  securityContext: {}

  # Shared task-logs volume (defined under workers[] and triggerer below)
  volumeMounts:
    - name: task-logs
      mountPath: /etc/vector/task_logs

  resources:
    limits:
      cpu: "0.5"
      memory: "1Gi"
    requests:
      cpu: "0.5"
      memory: "1Gi"

  # NOTE: the chart runs `config` through Helm `tpl`. Anything with double curly
  # braces INSIDE the config block (including comments!) is evaluated by Helm.
  # Vector label templates are therefore escaped with a raw string (see labels).
  config: |
    data_dir: /etc/vector/task_logs

    sources:
      task_logs:
        type: file
        include:
          - /etc/vector/task_logs/**/*.log

    transforms:
      parse_task_log_file:
        type: remap
        inputs:
          - task_logs
        source: |
          parsed = parse_regex!(.file, r'/dag_id=(?P<dagID>[0-9a-z-_]+)/run_id=(?P<runID>[^/]+)/task_id=(?P<taskID>[0-9a-z-_]+)/(?:map_index=(?P<mapIndex>-?[0-9]+)/)?attempt=(?P<attempt>[0-9]+)/(?P<tiID>[0-9a-z-]+)(?:\.log\.trigger\.[0-9]+)?\.log$')
          .tiID = parsed.tiID
          .attempt = parsed.attempt
          .taskID = parsed.taskID
          .runID = parsed.runID
          .dagID = parsed.dagID
          .mapIndex = if is_null(parsed.mapIndex) { "-1" } else { parsed.mapIndex }

    sinks:
      grafana_loki:
        type: loki
        inputs:
          - parse_task_log_file
        endpoint: https://logs-prod-036.grafana.net
        auth:
          strategy: basic
          user: "${LOKI_USER}"
          password: "${LOKI_TOKEN}"
        # Low-cardinality labels only. runID / attempt / tiID / mapIndex stay
        # on the event, NOT as labels.
        labels:
          job: astro-remote-execution
          deployment: explosive-electronics-2096
          dagID: "{{ `{{ dagID }}` }}"
          taskID: "{{ `{{ taskID }}` }}"
        encoding:
          codec: text

workers:
  - name: default-worker
    queues: default
    replicas: 1
    syncSlots: 20

    resources:
      limits:
        cpu: "1"
        ephemeral-storage: "1Gi"
        memory: "2Gi"
      requests:
        cpu: "1"
        ephemeral-storage: "1Gi"
        memory: "2Gi"

    env: []

    hpa:
      enabled: false
      minReplicaCount: 1
      maxReplicaCount: 1
      metric:
        enabled: true
        name: astro_agent_client_queued_or_running_tasks
        target:
          type: Value
          value: 20
      extraMetrics: []
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300

    keda:
      enabled: false

    terminationGracePeriodSeconds: 600

    livenessProbe:
      httpGet:
        path: healthz
        port: 39091
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3
      successThreshold: 1
      timeoutSeconds: 5

    readinessProbe:
      httpGet:
        path: healthz
        port: 39091
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3
      successThreshold: 1
      timeoutSeconds: 5

    containerSecurityContext: {}

    initContainers: []
    extraContainers: []

    # [GRAFANA] 2/3 — shared volume so the sidecar can read task logs
    volumes:
      - name: task-logs
        emptyDir: {}
    volumeMounts:
      - name: task-logs
        mountPath: /usr/local/airflow/logs

    canUseKubernetesPodOperator: false

